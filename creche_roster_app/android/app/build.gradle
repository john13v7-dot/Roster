apply plugin: 'com.android.application'

android {
    namespace 'com.crecheroster.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.crecheroster.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/roster-release.keystore")
            storePassword "roster-sideload-2026"
            keyAlias "roster"
            keyPassword "roster-sideload-2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
