name: Build Roster Android APK

on:
  push:
    branches: [ claude/roster-scheduling-algorithm-kiaow2 ]
    paths:
      - 'creche_roster_app/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creche_roster_app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Reconstruct signing keystore from secret
        env:
          ROSTER_KEYSTORE_BASE64: ${{ secrets.ROSTER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -z "$ROSTER_KEYSTORE_BASE64" ]; then
            echo "::warning::ROSTER_KEYSTORE_BASE64 secret not set - using a throwaway CI-only keystore so the build can still be validated. Set the real secret before installing this build (see creche_roster_app/android/keystore/README.md)."
            keytool -genkeypair -v -keystore keystore/roster-release.keystore -alias roster \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass roster-sideload-2026 -keypass roster-sideload-2026 \
              -dname "CN=CI Test, OU=CI, O=CI, L=NA, ST=NA, C=US"
          else
            echo "$ROSTER_KEYSTORE_BASE64" | base64 -d > keystore/roster-release.keystore
          fi

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roster-app-release-apk
          path: creche_roster_app/android/app/build/outputs/apk/release/*.apk

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          gh release create "roster-app-run${{ github.run_number }}" \
            "$apk" \
            --title "Creche Roster app (build ${{ github.run_number }})" \
            --notes "Automated Android build of the Creche Roster app from commit ${{ github.sha }}. Download the .apk below and open it on your Android phone to install (you may need to allow \"install unknown apps\" for your browser/file manager)." \
            --repo "${{ github.repository }}"
